name: dwp

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: wager_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local_admin_only}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_app_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -X -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
      SQS_ENABLE_MESSAGE_RETENTION_PERIOD: "1"
      PERSISTENCE: "0"
      LOCALSTACK_HOST: localstack:4566
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack:/opt/dwp-sqs:ro
      - ./infra/localstack/10-init-sqs.sh:/etc/localstack/init/ready.d/10-init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "python3", "/opt/dwp-sqs/provision.py", "check"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s
    stop_grace_period: 30s

volumes:
  postgres_data:
